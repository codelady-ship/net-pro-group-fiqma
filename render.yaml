# Render Blueprint for the API in backend/ (free web service).
# The database is MongoDB Atlas (free M0 cluster): paste its connection string as MONGODB_URI.
services:
  - type: web
    name: net-pro-group-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Public read-only demo admin (demo@netprogroup.az / demo1234): sees only the sample inquiries
      # from `npm run seed:demo`; every write returns 403. Set to "false" to turn it off.
      - key: DEMO_LOGIN
        value: "true"
      - key: CORS_ORIGINS
        value: https://codelady-ship.github.io
